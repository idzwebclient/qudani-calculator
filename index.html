<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1C1B19">
<title>Qudani Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1C1B19;
    --ink-soft:#2A2724;
    --paper:#FAF6EC;
    --paper-dim:#F0E9D8;
    --brass:#A9782E;
    --brass-light:#C99A45;
    --brass-dark:#7A5620;
    --text:#2A2521;
    --muted:#8B8072;
    --line:#DCD2B9;
    --pass:#2F7D4A;
    --pass-soft:rgba(47,125,74,0.14);
    --loss:#B43C32;
    --loss-soft:rgba(180,60,50,0.14);
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 50% -10%, #2b2823 0%, var(--ink) 55%),
      var(--ink);
    display:flex;
    justify-content:center;
    padding:32px 16px 48px;
  }

  button,
  input,
  select{
    font:inherit;
  }

  .container{
    width:100%;
    max-width:460px;
  }

  .brand{
    text-align:center;
    margin-bottom:22px;
  }

  .brand-mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:46px;
    height:46px;
    border-radius:50%;
    background:linear-gradient(155deg,var(--brass-light),var(--brass-dark));
    box-shadow:
      0 4px 14px rgba(169,120,46,0.35),
      inset 0 1px 1px rgba(255,255,255,0.4);
    margin-bottom:10px;
  }

  .brand-mark svg{
    width:24px;
    height:24px;
  }

  .brand h1{
    font-weight:700;
    font-size:26px;
    letter-spacing:0.01em;
    color:var(--paper);
    margin:0;
  }

  .brand p{
    margin:4px 0 0;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--brass-light);
  }

  .card{
    background:var(--paper);
    border-radius:18px;
    padding:22px 20px 24px;
    box-shadow:0 24px 60px rgba(0,0,0,0.45);
    border:1px solid rgba(169,120,46,0.25);
  }

  .input-group{
    margin-bottom:14px;
  }

  .input-group.hidden{
    display:none;
  }

  label{
    display:block;
    margin-bottom:6px;
    font-size:12.5px;
    font-weight:600;
    color:#665C4E;
  }

  .select-wrap,
  .field{
    position:relative;
  }

  .select-wrap::after{
    content:"";
    position:absolute;
    right:15px;
    top:50%;
    width:8px;
    height:8px;
    border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);
    transform:translateY(-70%) rotate(45deg);
    pointer-events:none;
  }

  .field .affix{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    pointer-events:none;
  }

  .field .affix.prefix{
    left:13px;
  }

  .field .affix.suffix{
    right:13px;
  }

  input,
  select{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:16px;
    font-weight:500;
    background:#fff;
    color:var(--text);
    transition:
      border-color .15s ease,
      background .15s ease,
      box-shadow .15s ease;
  }

  select{
    appearance:none;
    -webkit-appearance:none;
    padding-right:44px;
    cursor:pointer;
  }

  input::placeholder{
    color:#C3B9A5;
  }

  .field.has-prefix input{
    padding-left:42px;
  }

  .field.has-suffix input{
    padding-right:48px;
  }

  input:focus,
  select:focus{
    outline:none;
    border-color:var(--brass);
    background:#FFFDF6;
    box-shadow:0 0 0 3px rgba(169,120,46,0.12);
  }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:2px;
  }

  .hint{
    font-size:11px;
    color:var(--muted);
    margin-top:5px;
  }

  .btn-primary{
    width:100%;
    padding:16px;
    margin-top:6px;
    background:linear-gradient(155deg,var(--brass-light),var(--brass-dark));
    color:#fff;
    border:none;
    border-radius:11px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:
      0 8px 20px rgba(122,86,32,0.35),
      inset 0 1px 0 rgba(255,255,255,0.3);
    transition:
      transform .1s ease,
      box-shadow .1s ease;
  }

  .btn-primary:active{
    transform:translateY(1px);
    box-shadow:0 4px 12px rgba(122,86,32,0.3);
  }

  /* Modal */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0, 0, 0, 0.62);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    display:none;
    justify-content:center;
    align-items:center;
    padding:24px;
    z-index:10;
  }

  .ticket{
    width:100%;
    max-width:360px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 30px 70px rgba(0,0,0,0.5);
    position:relative;
    animation:rise .22s ease-out;
  }

  @keyframes rise{
    from{
      opacity:0;
      transform:translateY(10px) scale(.98);
    }
    to{
      opacity:1;
      transform:none;
    }
  }

  .punch{
    height:16px;
    background:
      radial-gradient(circle at center, transparent 7px, var(--paper) 7.5px);
    background-size:22px 16px;
    background-repeat:repeat-x;
    background-position:-4px center;
  }

  .ticket-inner{
    padding:6px 22px 20px;
    position:relative;
    overflow:hidden;
  }

  .stamp{
    position:absolute;
    top:8px;
    right:10px;
    width:72px;
    height:72px;
    border-radius:50%;
    border:2px solid currentColor;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:rotate(-14deg);
    opacity:.86;
    font-size:13px;
    font-weight:800;
    color:var(--pass);
    letter-spacing:.08em;
    text-align:center;
    box-shadow:inset 0 0 0 3px var(--pass-soft);
    transition:
      color .2s ease,
      box-shadow .2s ease;
  }

  .stamp.pass{
    color:var(--pass);
    box-shadow:inset 0 0 0 3px var(--pass-soft);
  }

  .stamp.loss{
    color:var(--loss);
    box-shadow:inset 0 0 0 3px var(--loss-soft);
  }

  .ticket-title{
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    padding-top:12px;
  }

  .ticket-title b{
    color:var(--ink);
  }

  .ticket-divider{
    border:none;
    border-top:1.5px dashed var(--line);
    margin:12px 0;
  }

  .result-content{
    font-size:13px;
    font-weight:500;
    line-height:1.9;
    color:var(--text);
    white-space:pre-wrap;
  }

  .result-content.pass{
    border-left:4px solid var(--pass);
    padding-left:12px;
  }

  .result-content.loss{
    border-left:4px solid var(--loss);
    padding-left:12px;
  }

  .status-note{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
    padding:10px 12px;
    border-radius:9px;
    font-size:12px;
    font-weight:700;
  }

  .status-note.pass{
    color:var(--pass);
    background:var(--pass-soft);
  }

  .status-note.loss{
    color:var(--loss);
    background:var(--loss-soft);
  }

  .status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:currentColor;
    flex-shrink:0;
  }

  .btn-group{
    display:flex;
    gap:10px;
    margin-top:16px;
  }

  .close-btn{
    flex:1;
    padding:12px;
    border-radius:9px;
    background:transparent;
    border:1.5px solid var(--line);
    color:#665C4E;
    font-weight:700;
    font-size:12.5px;
    text-align:center;
    cursor:pointer;
    letter-spacing:.03em;
  }

  .secondary-btn{
    flex:1.4;
    padding:12px;
    border-radius:9px;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.03em;
    cursor:pointer;
  }

  @media (max-width:480px){
    body{
      padding:20px 10px 32px;
    }

    .card{
      padding:20px 16px 22px;
    }

    .modal-overlay{
      padding:14px;
    }
  }
</style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2L4 6V12C4 16.5 7.4 20.7 12 22C16.6 20.7 20 16.5 20 12V6L12 2Z"
          stroke="#1C1B19" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 12L11 14L15.5 9.5"
          stroke="#1C1B19" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Qudani Jewels</h1>
    <p>Kalkulator Pajak &amp; Emas</p>
  </div>

  <div class="card">

    <div class="input-group">
      <label for="jenis">Jenis Kiraan</label>

      <div class="select-wrap">
        <select id="jenis" onchange="toggleFields()">
          <option value="pajak">Pajak Cina</option>
          <option value="rahnu">Ar-Rahnu</option>
          <option value="buyback">Emas Di Tangan</option>
        </select>
      </div>
    </div>

    <div class="input-group" id="div_utama">
      <label id="label_utama" for="amaun_utama">Amaun Pinjaman (RM)</label>

      <div class="field has-prefix">
        <span class="affix prefix">RM</span>
        <input type="number" id="amaun_utama" placeholder="0.00" inputmode="decimal" step="0.01">
      </div>
    </div>

    <div class="input-group hidden" id="div_upah">
      <label for="upah6bln">Upah Simpan 6 Bulan (RM)</label>

      <div class="field has-prefix">
        <span class="affix prefix">RM</span>
        <input type="number" id="upah6bln" placeholder="0.00" inputmode="decimal" step="0.01">
      </div>
    </div>

    <div class="input-group" id="div_bulan">
      <label for="bulan">Bilangan Bulan</label>

      <div class="field has-suffix">
        <input type="number" id="bulan" placeholder="0" inputmode="numeric" step="1">
        <span class="affix suffix">bln</span>
      </div>
    </div>

    <div class="input-group">
      <label for="mutu">Mutu Emas</label>
      <input type="text" id="mutu" placeholder="916 / 375">
    </div>

    <div class="input-group">
      <label for="berat">Berat Emas</label>

      <div class="field has-suffix">
        <input type="number" id="berat" placeholder="0.00" inputmode="decimal" step="0.01">
        <span class="affix suffix">g</span>
      </div>
    </div>

    <div class="input-group">
      <label for="hargaGram">Harga klbuyback.com (RM/g)</label>

      <div class="field has-prefix">
        <span class="affix prefix">RM</span>
        <input type="number" id="hargaGram" placeholder="0.00" inputmode="decimal" step="0.01">
      </div>
    </div>

    <div class="input-group hidden" id="div_tolakan">
      <label for="tolakan">Tolakan Kos / Untung</label>

      <div class="field has-prefix">
        <span class="affix prefix">RM</span>
        <input type="number" id="tolakan" value="50" inputmode="decimal" step="0.01">
      </div>

      <div class="hint">Minimum RM50</div>
    </div>

    <button class="btn-primary" type="button" onclick="kira()">
      Kira Sekarang
    </button>

  </div>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="ticket" role="dialog" aria-modal="true" aria-labelledby="resultTitle">

    <div class="punch"></div>

    <div class="ticket-inner">

      <div id="resultStamp" class="stamp pass">PASS</div>

      <div id="resultTitle" class="ticket-title">
        Hasil Kiraan &middot; <b>Resit</b>
      </div>

      <hr class="ticket-divider">

      <div id="resultBody" class="result-content pass"></div>

      <div id="statusNote" class="status-note pass">
        <span class="status-dot"></span>
        <span id="statusText">Nilai baki adalah positif.</span>
      </div>

      <div class="btn-group">
        <button class="close-btn" type="button" onclick="tutupModal()">
          Tutup
        </button>

        <button class="secondary-btn" type="button" onclick="copyText()">
          Salin Jawapan
        </button>
      </div>

    </div>

    <div class="punch"></div>

  </div>
</div>

<script src="config.js"></script>
<script>
function toggleFields() {
  const jenis = document.getElementById('jenis').value;

  document
    .getElementById('div_utama')
    .classList.toggle('hidden', jenis === 'buyback');

  document
    .getElementById('div_bulan')
    .classList.toggle('hidden', jenis === 'buyback');

  document
    .getElementById('div_upah')
    .classList.toggle('hidden', jenis !== 'rahnu');

  document
    .getElementById('div_tolakan')
    .classList.toggle('hidden', jenis !== 'buyback');

  document.getElementById('label_utama').innerText =
    jenis === 'rahnu'
      ? 'Amaun Pembiayaan (RM)'
      : 'Amaun Pinjaman (RM)';
}

function kira() {
  const jenis = document.getElementById('jenis').value;
  const amaun = parseFloat(document.getElementById('amaun_utama').value) || 0;
  const upah6bln = parseFloat(document.getElementById('upah6bln').value) || 0;
  const bulan = parseFloat(document.getElementById('bulan').value) || 0;
  const mutu = document.getElementById('mutu').value || "-";
  const berat = parseFloat(document.getElementById('berat').value) || 0;
  const hargaGram = parseFloat(document.getElementById('hargaGram').value) || 0;
  const tolakan = parseFloat(document.getElementById('tolakan').value) || 0;

  let nt = 0;
  let bl = 0;
  const ns = hargaGram * berat;

  // Buffer harga (RM/g)
  // Ubah nilai ini sahaja jika ingin tukar buffer.
  // Tukar sini
  // Tukar sini
  // Tukar sini
  // Tukar sini
  const hargaBuffer = hargaGram - CONFIG.BUFFER_HARGA;
  const nilaiBarangBuffer = hargaBuffer * berat;

  if (jenis === 'pajak') {
    nt = amaun + (amaun * (bulan * 0.02));
    bl = nilaiBarangBuffer - nt;

  } else if (jenis === 'rahnu') {
    nt = ((upah6bln / 6) * bulan) + amaun;
    bl = nilaiBarangBuffer - nt;

  } else {
    nt = 0;
    bl = nilaiBarangBuffer - tolakan;
  }

  const formatRM = (n) =>
    "RM " +
    n.toLocaleString('en-MY', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  const output =
`Nilai tebus   : ${formatRM(nt)}
Mutu          : ${mutu}
Berat         : ${berat.toFixed(2)} g
Nilai semasa  : ${formatRM(ns)}
Baki lebihan  : ${formatRM(bl)}

*Peringatan: Tolak kos runner (RM10-100) & untung syarikat sebelum bagi harga ke pelanggan.`;

  document.getElementById('resultBody').innerText = output;

  const isPass = bl >= 0;
  const statusClass = isPass ? 'pass' : 'loss';

  const stamp = document.getElementById('resultStamp');
  stamp.innerText = isPass ? 'PASS' : 'LOSS';
  stamp.className = `stamp ${statusClass}`;

  const resultBody = document.getElementById('resultBody');
  resultBody.className = `result-content ${statusClass}`;

  const statusNote = document.getElementById('statusNote');
  statusNote.className = `status-note ${statusClass}`;

  document.getElementById('statusText').innerText =
    isPass
      ? 'Nilai baki adalah positif.'
      : 'Nilai baki adalah negatif. Transaksi ini mengalami kerugian.';

  document.getElementById('modalOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function tutupModal() {
  document.getElementById('modalOverlay').style.display = 'none';
  document.body.style.overflow = '';
}

function handleOverlayClick(event) {
  if (event.target.id === 'modalOverlay') {
    tutupModal();
  }
}

async function copyText() {
  const text = document.getElementById('resultBody').innerText;

  try {
    await navigator.clipboard.writeText(text);
    alert("Jawapan disalin!");
  } catch (error) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';

    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);

    alert("Jawapan disalin!");
  }
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    tutupModal();
  }
});

toggleFields();
</script>

</body>
</html>
